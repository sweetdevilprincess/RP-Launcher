[project]
name = "rp-launcher-refactored"
version = "2.0.0"
description = "Refactored RP Launcher with clean architecture and comprehensive testing"
requires-python = ">=3.10"

[tool.ruff]
# Target Python 3.10+
target-version = "py310"

# Line length to match black
line-length = 100

# Exclude common directories
exclude = [
    ".git",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    "venv",
    "__pycache__",
    "build",
    "dist",
    "*.egg-info",
]

[tool.ruff.lint]
# Enable specific rule sets
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort (import sorting)
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "DTZ",  # flake8-datetimez
    "T10",  # flake8-debugger
    "EM",   # flake8-errmsg
    "ISC",  # flake8-implicit-str-concat
    "ICN",  # flake8-import-conventions
    "PIE",  # flake8-pie
    "PT",   # flake8-pytest-style
    "Q",    # flake8-quotes
    "RET",  # flake8-return
    "SIM",  # flake8-simplify
    "ARG",  # flake8-unused-arguments
    "PTH",  # flake8-use-pathlib
    "PL",   # pylint
    "RUF",  # ruff-specific rules
]

# Ignore specific rules
ignore = [
    "E501",    # Line too long (handled by formatter)
    "PLR0913", # Too many arguments
    "PLR2004", # Magic value in comparison
    "PT011",   # pytest.raises without match parameter
    "SIM108",  # Use ternary operator (can reduce readability)
    "RET504",  # Unnecessary variable assignment before return
    "TID252",  # Prefer absolute imports (relative imports are fine)
    "EM101",   # Exception string literals (acceptable in tests)
    "EM102",   # Exception f-string literals (acceptable in tests)
]

# Allow autofix for all enabled rules
fixable = ["ALL"]
unfixable = []

# Allow unused variables when prefixed with underscore
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]
# Tests can use assertions and relative imports
"tests/**/*.py" = [
    "S101",   # Use of assert
    "ARG001", # Unused function argument (fixtures)
    "PLR2004" # Magic value in comparison
]

# __init__ files can have unused imports (re-exports)
"__init__.py" = [
    "F401",   # Unused import
]

[tool.ruff.lint.isort]
# Import sorting configuration
known-first-party = ["src"]
section-order = [
    "future",
    "standard-library",
    "third-party",
    "first-party",
    "local-folder"
]

[tool.ruff.lint.pylint]
# Pylint-specific settings
max-args = 8
max-branches = 15
max-returns = 8
max-statements = 60

[tool.black]
# Black formatting configuration
line-length = 100
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # Exclude common directories
  \.git
  | \.mypy_cache
  | \.pytest_cache
  | \.ruff_cache
  | \.venv
  | venv
  | build
  | dist
)/
'''

[tool.mypy]
# MyPy type checking configuration
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # Start lenient, tighten over time
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

# Incremental typing - start with refactored modules
files = [
    "src/infrastructure/config/**/*.py",
    "src/infrastructure/transports/**/*.py",
    "src/domain/entities/**/*.py",
    "src/domain/sessions/**/*.py",
    "src/automation/**/*.py",
]

# Ignore missing imports for now
ignore_missing_imports = true

# Per-module options
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
# Pytest configuration
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# Show extra test summary info
addopts = [
    "-ra",                    # Show all test summary info
    "--strict-markers",       # Markers must be registered
    "--strict-config",        # Config issues are errors
    "--showlocals",           # Show local variables in tracebacks
    "-v",                     # Verbose output
]

# Markers for categorizing tests
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "smoke: marks tests as smoke tests",
    "e2e: marks tests as end-to-end tests",
    "agents: marks tests for the agent system",
]

# Coverage options
[tool.coverage.run]
source = ["src"]
branch = true
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/venv/*",
    "*/.venv/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false

# Fail if coverage drops below threshold
fail_under = 70

# Exclude lines from coverage
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.coverage.html]
directory = "htmlcov"
